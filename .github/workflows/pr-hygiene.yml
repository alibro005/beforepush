name: PR Hygiene

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  pr-title:
    name: PR Title
    runs-on: ubuntu-latest

    steps:
      - name: Check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$PR_TITLE" =~ ^(feat|fix|docs|test|refactor|style|chore|ci|perf|build|revert)(\([a-zA-Z0-9._-]+\))?!?:\ .+ ]]; then
            echo "❌ Invalid PR title: $PR_TITLE"
            echo "Use Conventional Commit format, for example:"
            echo "  feat: add version option"
            echo "  fix: handle missing target branch"
            echo "  docs: improve contributing guide"
            exit 1
          fi

          echo "✅ PR title is valid."

  pr-description:
    name: PR Description
    runs-on: ubuntu-latest

    steps:
      - name: Check PR description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [[ -z "${PR_BODY//[[:space:]]/}" ]]; then
            echo "❌ PR description cannot be empty."
            exit 1
          fi

          echo "✅ PR description is not empty."

  branch-name:
    name: Branch Name
    runs-on: ubuntu-latest

    steps:
      - name: Check branch name
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          if [[ ! "$BRANCH_NAME" =~ ^(feat|fix|docs|test|refactor|chore|ci|perf|build)/[a-z0-9]+([._-][a-z0-9]+)*$ ]]; then
            echo "❌ Invalid branch name: $BRANCH_NAME"
            echo "Use one of these formats:"
            echo "  feat/add-version-option"
            echo "  fix/missing-target-branch"
            echo "  docs/update-contributing"
            exit 1
          fi

          echo "✅ Branch name is valid."

  commit-messages:
    name: Commit Messages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          commits=$(git log --format=%s "$BASE_SHA..$HEAD_SHA")

          while IFS= read -r commit; do
            if [[ ! "$commit" =~ ^(feat|fix|docs|test|refactor|style|chore|ci|perf|build|revert)(\([a-zA-Z0-9._-]+\))?!?:\ .+ ]]; then
              echo "❌ Invalid commit message: $commit"
              echo "Use Conventional Commit format, for example:"
              echo "  feat: add version option"
              echo "  fix: handle missing target branch"
              exit 1
            fi
          done <<< "$commits"

          echo "✅ All commit messages are valid."